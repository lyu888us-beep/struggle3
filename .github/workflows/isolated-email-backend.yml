name: Deploy isolated email test backend (trigger file)

# Deploy only when the explicit trigger file changes on the session branch.
on:
  push:
    branches:
      - arena/663b9257-struggle3
    paths:
      - isolated-email-test/backend/deploy-trigger.txt

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/arena/663b9257-struggle3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test backend dependencies
        working-directory: 蓉渝康养行_顾客端_Cloudflare部署包/backend
        run: npm ci
      - name: Deploy only the isolated test Worker
        working-directory: 蓉渝康养行_顾客端_Cloudflare部署包/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ISOLATED_TEST_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config ../../isolated-email-test/backend/wrangler.toml
